name: Build

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: ".exe"
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build quiztia
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o "dist/quiztia-${{ matrix.name }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: quiztia-${{ matrix.name }}
          path: dist/quiztia-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          make_latest: true
          files: dist/*
