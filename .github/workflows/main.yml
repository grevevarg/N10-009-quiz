name: Build

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "internal/**"
      - "main.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build quiztia
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -o "dist/quiztia-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiztia-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/quiztia-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
